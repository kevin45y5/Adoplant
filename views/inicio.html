<!doctype html>
<html lang="es">
<head>

  <link rel="stylesheet" href="/views/recuperar.css">

<body>

    <p id="status" role="status">Comprobando tu sesión…</p>

      <p class="eyebrow">TU COMUNIDAD VERDE</p>

  </main>
