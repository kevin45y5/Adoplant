<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdopPlant - Iniciar Sesión y Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        phGreenDark: '#0D3B23',
                        phGreenMedium: '#235B3B',
                        phGreenLight: '#2D724A',
                        phCream: '#F8F5EE',
                        phInputBg: '#F3F1EA'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F5EE; }
    </style>
</head>
<body class="min-h-screen text-gray-800 antialiased">

    <div class="min-h-screen flex flex-col lg:flex-row">

        <div class="w-full bg-[#F8F5EE] p-6 lg:p-12 flex flex-col justify-center items-center relative min-h-screen">
            <div class="w-full max-w-md">

                <div class="flex flex-col items-center text-center mb-8">
                    <div class="w-20 h-20 bg-[#E2ECE9] rounded-full flex items-center justify-center mb-5 shadow-sm overflow-hidden">
                        <img src="/views/icon.jpeg" alt="Logo AdopPlant" class="w-full h-full object-cover">
                    </div>
                    <h2 id="pageTitle" class="text-3xl lg:text-4xl font-extrabold text-[#0D3B23] mb-2 tracking-tight">Bienvenido de nuevo</h2>
                    <p id="pageSubtitle" class="text-gray-500 text-sm">Ingresa tus credenciales para acceder</p>
                </div>

                <div class="bg-white rounded-[2rem] p-6 sm:p-8 shadow-xl shadow-emerald-900/5 border border-gray-100/80">

                    <div id="loginView" class="transition-all duration-300">
                        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-800 mb-1.5">Correo o teléfono</label>
                                <div class="relative flex items-center">
                                    <span class="absolute left-4 text-gray-400 text-sm"><i class="fa-regular fa-user"></i></span>
                                    <input type="text" id="loginEmail" required placeholder="tu@correo.com o +503 7000-0000"
                                        class="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-phInputBg text-gray-800 placeholder-gray-400 border border-transparent focus:border-phGreenDark focus:bg-white focus:outline-none transition-all text-sm font-medium">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-800 mb-1.5">Contraseña</label>
                                <div class="relative flex items-center">
                                    <span class="absolute left-4 text-gray-400 text-sm"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="loginPassword" required placeholder="••••••••"
                                        class="w-full pl-11 pr-11 py-3.5 rounded-2xl bg-phInputBg text-gray-800 placeholder-gray-400 border border-phGreenDark/40 focus:border-phGreenDark focus:bg-white focus:outline-none transition-all text-sm font-medium">
                                    <button type="button" onclick="togglePasswordVisibility('loginPassword', 'toggleLoginPassIcon')"
                                        class="absolute right-4 text-gray-400 hover:text-phGreenDark focus:outline-none p-1">
                                        <i id="toggleLoginPassIcon" class="fa-regular fa-eye-slash text-sm"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="flex justify-end pt-0.5">
                                <a href="#" onclick="showNotification('Instrucciones enviadas a tu correo.'); return false;"
                                   class="text-xs font-semibold text-gray-500 hover:text-phGreenDark transition-colors">
                                   ¿Olvidaste tu contraseña?
                                </a>
                            </div>

                            <button type="submit" id="loginBtn"
                                class="w-full py-4 bg-phGreenDark hover:bg-phGreenMedium text-white font-bold rounded-full shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-center space-x-2 text-base mt-3">
                                <span>Iniciar Sesión</span>
                                <i class="fa-solid fa-arrow-right text-sm"></i>
                            </button>
                        </form>
                    </div>

                    <div id="registerView" class="hidden transition-all duration-300">
                        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3.5">

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-gray-800 mb-1.5">Nombres</label>
                                    <div class="relative flex items-center">
                                        <span class="absolute left-4 text-gray-400 text-sm"><i class="fa-regular fa-user"></i></span>
                                        <input type="text" id="regFirstName" required placeholder="maria"
                                            class="w-full pl-11 pr-3 py-3 rounded-2xl bg-phInputBg text-gray-800 placeholder-gray-400 border border-transparent focus:border-phGreenDark focus:bg-white focus:outline-none text-sm font-medium">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-800 mb-1.5">Apellidos</label>
                                    <div class="relative flex items-center">
                                        <span class="absolute left-4 text-gray-400 text-sm"><i class="fa-regular fa-user"></i></span>
                                        <input type="text" id="regLastName" required placeholder="gomez"
                                            class="w-full pl-11 pr-3 py-3 rounded-2xl bg-phInputBg text-gray-800 placeholder-gray-400 border border-transparent focus:border-phGreenDark focus:bg-white focus:outline-none text-sm font-medium">
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-800 mb-1.5">Teléfono </label>
                                <div class="relative flex items-center">
                                    <span class="absolute left-4 text-gray-400 text-sm"><i class="fa-solid fa-phone"></i></span>
                                    <input type="tel" id="regPhone" required placeholder="+503 75341256"
                                        class="w-full pl-11 pr-4 py-3 rounded-2xl bg-phInputBg text-gray-800 placeholder-gray-400 border border-transparent focus:border-phGreenDark focus:bg-white focus:outline-none text-sm font-medium">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-800 mb-1.5">Correo electrónico</label>
                                <div class="relative flex items-center">
                                    <span class="absolute left-4 text-gray-400 text-sm"><i class="fa-regular fa-envelope"></i></span>
                                    <input type="email" id="regEmail" required placeholder="mariagomez@gmail.com"
                                        class="w-full pl-11 pr-4 py-3 rounded-2xl bg-phInputBg text-gray-800 placeholder-gray-400 border border-transparent focus:border-phGreenDark focus:bg-white focus:outline-none text-sm font-medium">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-800 mb-1.5">Contraseña</label>
                                <div class="relative flex items-center">
                                    <span class="absolute left-4 text-gray-400 text-sm"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="regPassword" required minlength="8" placeholder="•••••••••"
                                        class="w-full pl-11 pr-11 py-3 rounded-2xl bg-phInputBg text-gray-800 placeholder-gray-400 border border-transparent focus:border-phGreenDark focus:bg-white focus:outline-none text-sm font-medium">
                                    <button type="button" onclick="togglePasswordVisibility('regPassword', 'toggleRegPassIcon')"
                                        class="absolute right-4 text-gray-400 hover:text-phGreenDark focus:outline-none p-1">
                                        <i id="toggleRegPassIcon" class="fa-regular fa-eye-slash text-sm"></i>
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-800 mb-1.5">Confirmar contraseña</label>
                                <div class="relative flex items-center">
                                    <span class="absolute left-4 text-gray-400 text-sm"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="regPasswordConfirm" required placeholder="•••••••••"
                                        class="w-full pl-11 pr-11 py-3 rounded-2xl bg-phInputBg text-gray-800 placeholder-gray-400 border border-transparent focus:border-phGreenDark focus:bg-white focus:outline-none text-sm font-medium">
                                    <button type="button" onclick="togglePasswordVisibility('regPasswordConfirm', 'toggleRegConfirmPassIcon')"
                                        class="absolute right-4 text-gray-400 hover:text-phGreenDark focus:outline-none p-1">
                                        <i id="toggleRegConfirmPassIcon" class="fa-regular fa-eye-slash text-sm"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="flex items-center space-x-2.5 pt-1">
                                <input type="checkbox" id="termsCheck" required
                                    class="w-4 h-4 rounded border-gray-300 text-phGreenDark focus:ring-phGreenDark accent-phGreenDark cursor-pointer">
                                <label for="termsCheck" class="text-xs font-medium text-gray-700 cursor-pointer">
                                    Acepto los <a href="#" onclick="return false;" class="font-extrabold text-phGreenDark underline">Términos y Condiciones</a>
                                </label>
                            </div>

                            <button type="submit" id="registerBtn"
                                class="w-full py-4 bg-phGreenDark hover:bg-phGreenMedium text-white font-bold rounded-full shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-center space-x-2 text-base mt-3">
                                <span>Registrarse</span>
                                <i class="fa-solid fa-arrow-right text-sm"></i>
                            </button>
                        </form>
                    </div>

                </div>

                <div class="text-center mt-6">
                    <p id="toggleLoginText" class="text-sm font-medium text-gray-600">
                        ¿No tienes cuenta?
                        <button onclick="toggleForm('register')" class="font-extrabold text-[#0D3B23] hover:underline ml-1">Regístrate</button>
                    </p>
                    <p id="toggleRegisterText" class="text-sm font-medium text-gray-600 hidden">
                        ¿Ya tienes cuenta?
                        <button onclick="toggleForm('login')" class="font-extrabold text-[#0D3B23] hover:underline ml-1">Inicia sesión</button>
                    </p>
                </div>

            </div>
        </div>
    </div>

    
    <div id="welcomeModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 text-center shadow-2xl border border-emerald-100 transform transition-all duration-200 scale-95 opacity-0" id="modalContent">
            <div class="w-16 h-16 bg-emerald-100 text-phGreenDark rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 class="text-2xl font-bold text-gray-900 mb-2" id="modalTitle">¡Bienvenido!</h3>
            <p class="text-gray-600 text-sm mb-6" id="modalMessage">Has iniciado sesión correctamente.</p>
            <button onclick="closeWelcomeModal()" class="w-full py-3 bg-phGreenDark hover:bg-phGreenMedium text-white font-semibold rounded-xl shadow transition-colors">
                Continuar
            </button>
        </div>
    </div>

    
    <div id="toast" class="fixed top-5 right-5 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-lg translate-y-[-100px] opacity-0 transition-all duration-300 z-50 flex items-center space-x-3">
        <i class="fa-solid fa-circle-info text-emerald-400"></i>
        <span id="toastMessage" class="text-sm">Notificación</span>
    </div>

    <script src="/views/main.js"></script>
</body>
</html>
